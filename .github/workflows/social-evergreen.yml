name: Social Evergreen

on:
  schedule:
    # Cron is UTC-only and has no DST support, so each Eastern window is listed
    # at both offsets (EDT is UTC-4, EST is UTC-5); `gate` keeps the run whose
    # cron matches today's window.
    - cron: '37 13 * * 2,4'  # Tue/Thu 09:37 America/New_York (EDT)
    - cron: '37 14 * * 2,4'  # Tue/Thu 09:37 America/New_York (EST)
    - cron: '37 21 * * 0'    # Sun 17:37 America/New_York (EDT)
    - cron: '37 22 * * 0'    # Sun 17:37 America/New_York (EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-distribution-state
  cancel-in-progress: false

jobs:
  # Cron is UTC-only, so each Eastern window is scheduled at both DST offsets.
  # The gate keys off `github.event.schedule` — the cron that fired — so a run
  # delayed under load still resolves to the right window and the wrong offset
  # can never publish. Only the Eastern weekday comes from the clock, so keep
  # every job timeout in the shared concurrency group well under six hours: a
  # run held past Eastern midnight would read the next day and skip.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Resolve the Eastern window
        id: window
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            # A schedule event always carries the cron that fired, so an empty
            # value there means something is wrong and guessing could publish
            # off-window.
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo '::error::scheduled run carried no cron identifier; refusing to guess'
              exit 1
            fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Manual dispatch: the Eastern window gate does not apply.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r dow day clock zone offset <<< "$(TZ=America/New_York date '+%u %a %H:%M %Z %z')"
          case "$zone" in
            EST|EDT) ;;
            *) echo "::error::America/New_York tz data unavailable (${zone:-unknown}); refusing to guess"; exit 1 ;;
          esac
          case "$dow" in
            2|4) target=$((9 * 60 + 37)) ;;
            7)   target=$((17 * 60 + 37)) ;;
            *)   target='' ;;
          esac
          expected=''
          if [ -n "$target" ]; then
            # `%z` is the Eastern offset right now, so the expected UTC time of
            # today's window follows the current DST phase.
            minutes=$((target + 10#${offset:1:2} * 60))
            expected="$((minutes % 60)) $((minutes / 60))"
          fi
          read -r cron_min cron_hour _ <<< "$SCHEDULE"
          if [ -n "$expected" ] && [ "$cron_min" -eq "$((minutes % 60))" ] && [ "$cron_hour" -eq "$((minutes / 60))" ]; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Evergreen gate: local=$day $clock $zone, schedule='$SCHEDULE', expected='$expected' -> run=$run" >> "$GITHUB_STEP_SUMMARY"
          if [ "$run" = false ]; then
            if [ -n "$expected" ]; then
              echo "::notice::evergreen gate skipped this window: '$SCHEDULE' is not today's '$expected' Eastern run"
            else
              echo "::notice::evergreen gate skipped this window: $day is not an evergreen day"
            fi
          fi

  distribute:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/automation/requirements-build.lock
          python -m pip install --no-build-isolation --require-hashes -r scripts/automation/requirements.lock
      # Instagram is a default destination for evergreen cycles too, so the
      # carousel renderer has to be present on every run. `sharp` is the only
      # rendering dependency and no browser is downloaded.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install carousel renderer dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --omit=dev
      - name: Publish one eligible evergreen article
        id: publish
        continue-on-error: true
        env:
          DRY_RUN: 'false'
          FAIL_ON_PUBLISH_ERROR: 'true'
          DISTRIBUTION_MODE: evergreen
          USE_LLM: 'true'
          POST_MODE: thread
          THREAD_MODE: bullets
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_SIGNER_UUID: ${{ secrets.NEYNAR_SIGNER_UUID }}
          WEIBO_ACCESS_TOKEN: ${{ secrets.WEIBO_ACCESS_TOKEN }}
          WEIBO_APP_KEY: ${{ secrets.WEIBO_APP_KEY }}
          WEIBO_APP_SECRET: ${{ secrets.WEIBO_APP_SECRET }}
          WEIBO_REFRESH_TOKEN: ${{ secrets.WEIBO_REFRESH_TOKEN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_MEDIA_BASE_URL: ${{ secrets.INSTAGRAM_MEDIA_BASE_URL }}
          INSTAGRAM_MEDIA_UPLOAD_URL: ${{ secrets.INSTAGRAM_MEDIA_UPLOAD_URL }}
          INSTAGRAM_MEDIA_UPLOAD_SECRET: ${{ secrets.INSTAGRAM_MEDIA_UPLOAD_SECRET }}
        run: python -m scripts.automation.auto_post
      - name: Commit state
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add posted.json
          git diff --cached --quiet || git commit -m 'chore: update posted.json [skip ci]'
          git pull --rebase origin main
          git push origin main
      - name: Report retryable publication failure
        if: steps.publish.outcome == 'failure'
        run: exit 1
