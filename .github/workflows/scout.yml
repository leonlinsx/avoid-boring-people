name: Scout

# Lin Scout looks for the few current external conversations where an already
# published article would be a useful contribution. It is a reporting job: it
# searches, judges, captures its report privately, and records what it
# surfaced so the same opportunity is never surfaced twice. It never publishes
# anything, never touches the site build, and keeps live opportunities, drafts,
# and relationship state in one encrypted Actions artifact. Public logs expose only generic status. No model key or
# crashed run can affect leonlins.com.
#
# The last thing a run does is the Jev shadow experiment, switched on below so it
# collects observations from real runs. It is an experiment, and reads like one:
# it runs after the report and after the state file is written, it cannot change a
# candidate, and a failure in it is its own log line rather than a red run.
#
# Cadence is daily because Scout targets a handful of high-value opportunities,
# not real-time engagement. Discovery covers a bounded number of queries, so one
# run per day is a few minutes of work rather than a continuously running
# service.
on:
  schedule:
    # 07:00 UTC, before the daily token probe and the social cycles, so the
    # report is waiting while the other jobs spend their credentials.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Search and report only; record nothing'
        type: boolean
        default: false
      queries:
        description: 'Comma-separated queries instead of the derived ones'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: scout-state
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    # Discovery waits on two external services under their own timeouts; a hung
    # install or blocked request would otherwise hold the state file for a day.
    # The first 30 minutes are the run's own work — every bounded model request
    # (the judgment cap times the client's own timeout and retries), discovery,
    # and encrypted state persistence. The last ten minutes cover the Jev shadow
    # experiment tail: it starts only after scout-state.json is written, and it stops itself
    # at its own budget (SHADOW_BUDGET_SECONDS, four minutes) rather than spending
    # the clock the persistence step needs, so a Jev timeout can lengthen a run but
    # cannot cost it the persistence step that follows.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Restore encrypted private state
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_STATE_PASSPHRASE: ${{ secrets.SCOUT_STATE_PASSPHRASE }}
          SCOUT_STATE_BOOTSTRAP_B64: ${{ secrets.SCOUT_STATE_BOOTSTRAP_B64 }}
        run: |
          if [ -z "${SCOUT_STATE_PASSPHRASE}" ]; then
            echo "::error::SCOUT_STATE_PASSPHRASE is required"
            exit 1
          fi
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=scout-private-state&per_page=100" --jq "[.artifacts[] | select(.expired == false)][0].id // empty")"
          if [ -n "${artifact_id}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/scout-private-state.zip
            unzip -q /tmp/scout-private-state.zip -d /tmp/scout-private-state
            gpg --batch --yes --pinentry-mode loopback --passphrase "${SCOUT_STATE_PASSPHRASE}" \
              --output /tmp/scout-private-state.tar.gz --decrypt /tmp/scout-private-state/scout-private-state.tar.gz.gpg
            mkdir -p /tmp/scout-restored
            tar -xzf /tmp/scout-private-state.tar.gz -C /tmp/scout-restored
            cp /tmp/scout-restored/scout-private/scout-state.json scout-state.json
          elif [ -n "${SCOUT_STATE_BOOTSTRAP_B64}" ]; then
            printf "%s" "${SCOUT_STATE_BOOTSTRAP_B64}" | base64 --decode > scout-state.json
          else
            echo "::error::No prior private Scout artifact exists; seed SCOUT_STATE_BOOTSTRAP_B64 before the first run"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/automation/requirements-build.lock
          python -m pip install --no-build-isolation --require-hashes -r scripts/automation/requirements.lock
      # The Jev shadow experiment's own client, into the same environment the run
      # uses. Deliberately not added to the pinned requirements: the experiment
      # is removable, and removing it is deleting this step and the two
      # variables it needs below.
      #
      # `continue-on-error` is what makes that true for the job and not only for
      # the code: a PyPI hiccup, a yanked version, or a resolver conflict here
      # would otherwise fail the run before it started, and this experiment is
      # never worth a day without a report. The CLI skips cleanly when the
      # package is missing, exactly as it does on a machine that never installed
      # it.
      - name: Install the shadow experiment's SDK
        continue-on-error: true
        run: python -m pip install 'typesafe-sdk==0.7.0'
      # Public-repository Actions logs are public. Capture the full report and
      # diagnostics to a file that is encrypted with the state; print only generic
      # status before the encrypted artifact is uploaded.
      - name: Find today's opportunities
        id: scout
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          # The Jev shadow experiment, switched on so it collects observations
          # from real runs. It is best effort by construction: the CLI calls it
          # after the report and after scout-state.json is written, it cannot
          # change what was surfaced or recorded, and its failures — a timeout, a
          # bad key, a broken response — are its own log lines. The key goes
          # straight to the SDK from the secret below: it is never written to a
          # file, an artifact, or the state, and never echoed.
          SCOUT_JEV_SHADOW: '1'
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Dispatch inputs arrive through the environment so a query typed into
          # the run form is data, not shell source.
          SCOUT_DRY_RUN: ${{ inputs.dry_run }}
          SCOUT_QUERIES: ${{ inputs.queries }}
        run: |
          args=()
          if [ "${SCOUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${SCOUT_QUERIES}" ]; then
            args+=(--queries "${SCOUT_QUERIES}")
          fi
          set +e
          GITHUB_STEP_SUMMARY= python -m scripts.scout run "${args[@]}" > scout-report.txt 2>&1
          scout_exit=$?
          set -e
          if [ "${scout_exit}" -eq 0 ]; then
            echo "Scout completed; the private report is in the encrypted artifact."
          else
            echo "::error::Scout failed; diagnostic output is in the encrypted artifact."
          fi
          exit "${scout_exit}"
      - name: Encrypt private Scout state and report
        if: always()
        env:
          SCOUT_STATE_PASSPHRASE: ${{ secrets.SCOUT_STATE_PASSPHRASE }}
        run: |
          if [ -z "${SCOUT_STATE_PASSPHRASE}" ] || [ ! -f scout-state.json ]; then
            echo "::error::Private Scout state cannot be persisted"
            exit 1
          fi
          mkdir -p /tmp/scout-private
          cp scout-state.json /tmp/scout-private/
          if [ -f scout-report.txt ]; then cp scout-report.txt /tmp/scout-private/; fi
          if [ -f scout-shadow.jsonl ]; then cp scout-shadow.jsonl /tmp/scout-private/; fi
          tar -czf /tmp/scout-private-state.tar.gz -C /tmp scout-private
          gpg --batch --yes --pinentry-mode loopback --passphrase "${SCOUT_STATE_PASSPHRASE}" \
            --symmetric --cipher-algo AES256 --output /tmp/scout-private-state.tar.gz.gpg /tmp/scout-private-state.tar.gz
      - name: Upload encrypted private Scout state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scout-private-state
          path: /tmp/scout-private-state.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
      - name: Report scout failure
        if: steps.scout.outcome == 'failure'
        run: exit 1
