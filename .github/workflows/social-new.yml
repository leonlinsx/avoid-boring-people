name: Social New Article

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**/index.md'
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Deployed search-index id to retry'
        required: false
      dry_run:
        description: 'Render and route only; do not publish or update state'
        type: boolean
        default: false
      platforms:
        description: 'Manual runs only: comma-separated platforms (e.g. twitter,bluesky); empty keeps production defaults'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: social-distribution-state
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Detect newly added articles
        id: added
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_POST_ID: ${{ inputs.post_id }}
        run: |
          # A manual run has no `before` commit, and a brand new branch reports
          # an all-zero one; both mean there is no diff to inspect.
          if [ -n "$MANUAL_POST_ID" ]; then
            echo "$MANUAL_POST_ID" > "$RUNNER_TEMP/post_ids"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            : > "$RUNNER_TEMP/post_ids"
          else
            git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'src/content/blog/**/index.md' |
              sed 's#^src/content/blog/##' > "$RUNNER_TEMP/post_ids"
          fi
          if [ -s "$RUNNER_TEMP/post_ids" ]; then echo 'found=true' >> "$GITHUB_OUTPUT"; else echo 'found=false' >> "$GITHUB_OUTPUT"; fi
      # The push that starts this run is also what triggers the deploy, and the
      # distribution code reads the article from the deployed search index. Poll
      # until the new article is actually servable, so a slow deploy is waited
      # out instead of failing the run for a manual re-run. Runs before the
      # installs so the deployment and the dependency downloads overlap.
      - name: Wait for the new articles to deploy
        if: steps.added.outputs.found == 'true'
        run: python3 -m scripts.automation.wait_for_deploy --post-id-file "$RUNNER_TEMP/post_ids"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.added.outputs.found == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.added.outputs.found == 'true'
        run: |
          python -m pip install --require-hashes -r scripts/automation/requirements-build.lock
          python -m pip install --no-build-isolation --require-hashes -r scripts/automation/requirements.lock
      # Instagram is a production default, so the automatic push-triggered run
      # (no `platforms` input, meaning production defaults) needs the carousel
      # renderer too. A manual run only installs it when it can target Instagram.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.added.outputs.found == 'true' && (inputs.platforms == '' || contains(inputs.platforms, 'instagram'))
        with:
          node-version: '22'
      - name: Install carousel renderer dependencies
        if: steps.added.outputs.found == 'true' && (inputs.platforms == '' || contains(inputs.platforms, 'instagram'))
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --omit=dev
      - name: Wait for deployment and distribute added articles
        id: publish
        if: steps.added.outputs.found == 'true'
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FAIL_ON_PUBLISH_ERROR: 'true'
          DISTRIBUTION_MODE: new
          USE_LLM: 'true'
          POST_MODE: thread
          THREAD_MODE: bullets
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_SIGNER_UUID: ${{ secrets.NEYNAR_SIGNER_UUID }}
          WEIBO_ACCESS_TOKEN: ${{ secrets.WEIBO_ACCESS_TOKEN }}
          WEIBO_APP_KEY: ${{ secrets.WEIBO_APP_KEY }}
          WEIBO_APP_SECRET: ${{ secrets.WEIBO_APP_SECRET }}
          WEIBO_REFRESH_TOKEN: ${{ secrets.WEIBO_REFRESH_TOKEN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_MEDIA_BASE_URL: ${{ secrets.INSTAGRAM_MEDIA_BASE_URL }}
          INSTAGRAM_MEDIA_UPLOAD_URL: ${{ secrets.INSTAGRAM_MEDIA_UPLOAD_URL }}
          INSTAGRAM_MEDIA_UPLOAD_SECRET: ${{ secrets.INSTAGRAM_MEDIA_UPLOAD_SECRET }}
        run: |
          if [ -n "${{ inputs.platforms }}" ]; then
            allowed="twitter linkedin bluesky mastodon farcaster weibo nostr threads reddit devto instagram publish0x"
            valid=""
            IFS=',' read -ra requested <<< "${{ inputs.platforms }}"
            for item in "${requested[@]}"; do
              item="$(echo "$item" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
              case " $allowed " in
                *" $item "*) valid="${valid:+$valid,}$item" ;;
                *) echo "Unknown platform: $item" >&2; exit 1 ;;
              esac
            done
            export PLATFORM="$valid"
          fi
          while IFS= read -r post_id; do TARGET_POST_ID="$post_id" python -m scripts.automation.auto_post; done < "$RUNNER_TEMP/post_ids"
      - name: Commit state
        if: steps.added.outputs.found == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add posted.json
          git diff --cached --quiet || git commit -m 'chore: update posted.json [skip ci]'
          git pull --rebase origin main
          git push origin main
      - name: Report retryable publication failure
        if: steps.added.outputs.found == 'true' && steps.publish.outcome == 'failure'
        run: exit 1
