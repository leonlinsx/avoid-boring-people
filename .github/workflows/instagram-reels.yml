name: ABP Reel experiments

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: preflight
        options: [preflight, pilot, publish, measure, weekly, verify, reconcile-no-publish]
      concept:
        description: 'Exact approved concept for one explicit pilot (e.g. abp002-19)'
        type: string
        required: false
  schedule:
    # Hourly eligibility checks recover from delayed/blocked slots. The queue,
    # not the number of cron ticks, enforces 3/rolling-24h and >=3h spacing.
    - cron: '15 * * * *'
    - cron: '45 * * * *'
    - cron: '25 7 * * 1'

permissions:
  contents: write

# A single group covers publish, measurement and weekly state CAS updates.
concurrency:
  group: abp-instagram-reel-state
  cancel-in-progress: false

jobs:
  reels:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ABP_REELS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned HTTP dependencies
        run: python -m pip install --require-hashes -r scripts/instagram_growth/requirements-hosted.lock
      - name: Install video preflight dependency on ephemeral runner
        if: inputs.action == 'pilot' || inputs.action == 'publish' || github.event.schedule == '15 * * * *'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version
      - name: Run one bounded ABP operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ABP_REELS_PUBLISH: ${{ vars.ABP_REELS_ENABLED == 'true' && 'enabled' || '' }}
          ABP_REELS_MAX_PER_24H: '3'
          ABP_REELS_MIN_SPACING_HOURS: '3'
          MANUAL_ACTION: ${{ inputs.action }}
          PILOT_CONCEPT: ${{ inputs.concept }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$GITHUB_EVENT_NAME:$EVENT_SCHEDULE" in
            schedule:'15 * * * *') action=publish ;;
            schedule:'45 * * * *') action=measure ;;
            schedule:'25 7 * * 1') action=weekly ;;
            workflow_dispatch:*) action="$MANUAL_ACTION" ;;
            *) echo 'Unknown schedule; refusing to infer an operation'; exit 1 ;;
          esac
          python -m scripts.instagram_growth.hosted "$action" --concept "$PILOT_CONCEPT"
      - name: Preserve weekly scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abp-weekly-scorecard-${{ github.run_id }}
          path: reports/instagram-growth/
          if-no-files-found: ignore
          retention-days: 30
