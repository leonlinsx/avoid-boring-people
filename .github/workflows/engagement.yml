name: Engagement ledger

# The distribution flow would otherwise never learn whether a post worked.
# This weekly read-only pass re-reads the remote posts `posted.json` already
# recorded (Bluesky keyless; Mastodon, Farcaster, DEV through their existing
# read credentials) and commits the public counts to `engagement.json`, where
# evergreen ranking reads them back. It publishes nothing and writes nothing
# except the ledger. Threads/Instagram expose no read API without an app
# token the repository deliberately does not store, so they stay uncovered.
on:
  schedule:
    # Monday morning UTC: after the Sunday evergreen window, so the newest
    # observations are at most a day old when ranking reads them.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engagement-ledger
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/automation/requirements-build.lock
          python -m pip install --no-build-isolation --require-hashes -r scripts/automation/requirements.lock
      - name: Collect public engagement
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python -m scripts.automation.engagement
      - name: Commit ledger
        env:
          PUSH_TOKEN: ${{ secrets.SOCIAL_STATE_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo '::error::SOCIAL_STATE_PUSH_TOKEN is required to commit distribution state to protected main'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add engagement.json
          git diff --cached --quiet || git commit -m 'chore: update engagement.json [skip ci]'
          git pull --rebase origin main
          if ! git push origin main; then
            echo '::error::SOCIAL_STATE_PUSH_TOKEN could not update protected main; verify its repository access and branch-protection bypass'
            exit 1
          fi
