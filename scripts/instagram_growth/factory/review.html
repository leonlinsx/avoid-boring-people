<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABP batch review</title><style>
body{font:1rem/1.5 system-ui;margin:0;background:#edf1ed;color:#17282d}main{max-width:72rem;margin:auto;padding:1.5rem}article{background:white;border:1px solid #809293;border-radius:.8rem;padding:1.5rem;margin-block:1.5rem;display:flow-root}video{float:right;max-width:100%;height:auto;margin-inline-start:1.5rem;background:#17282d}pre{white-space:pre-wrap;overflow-wrap:anywhere}blockquote{margin-inline:0;border-inline-start:3px solid #607779;padding-inline-start:1rem}label{display:inline-block;padding:.65rem}input,textarea,button{font:inherit}textarea{width:95%;min-height:3rem}button{padding:.8rem;min-height:48px;background:#193b34;color:white;border:0;border-radius:.3rem}fieldset{padding:.8rem;clear:both}input[type=text]{padding:.6rem;border:1px solid #596b6b}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1656c1;outline-offset:3px}.warning{background:#fff4cf;padding:.8rem}header{padding-block:1rem}#status{font-weight:bold}@media(max-width:40rem){video{float:none;margin:0}article{padding:1rem}}
</style></head><body><main><h1>ABP batch review</h1>
<p>Watch each complete video, compare its source, verify rights and pronunciation, then choose a decision. Pending is the default. Exporting a file does not approve, upload or publish anything.</p>
<noscript>JavaScript is needed only to export decisions. Review the manifest and use the documented CLI if unavailable.</noscript>
<form id="review-form" aria-labelledby="review-title" action="#" method="post"><header><h2 id="review-title">One recorded batch decision</h2>
<label for="reviewer">Reviewer name (required)</label><input id="reviewer" name="reviewer" type="text" autocomplete="name" required maxlength="100">
<p><input id="confirmed" name="confirmed" type="checkbox" required><label for="confirmed">I personally reviewed complete playback, source fidelity, attribution and rights for every asset I mark approved.</label></p>
<button type="submit">Export review decisions</button><p id="status" role="status"></p></header>
<!--CARDS--></form></main><script id="manifest" type="application/json">/*MANIFEST*/null</script><script src="review.js"></script></body></html>
